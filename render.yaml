services:
  - type: web
    name: signalscout-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string: postgresql+psycopg://...?sslmode=require
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        sync: false # e.g. https://signalscout.vercel.app
