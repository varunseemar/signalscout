services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: signalscout
      POSTGRES_PASSWORD: signalscout
      POSTGRES_DB: signalscout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalscout"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
