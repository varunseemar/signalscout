[project]
name = "signalscout"
version = "0.1.0"
description = "Funding-signal lead engine: scrape funding news, extract, enrich, validate and score leads."
readme = "README.md"
authors = [
    { name = "varunseemar", email = "varunseemar1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.4.0",
    "dateparser>=1.4.3",
    "dnspython>=2.9.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "scrapy>=2.19.0",
    "sqlalchemy>=2",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
    "w3lib>=2.5.0",
]

[project.scripts]
signalscout = "signalscout.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
]
